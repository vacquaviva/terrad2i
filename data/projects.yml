[
  {"title":"Improved ML modeling of Ocean Carbon","image":"assets/projects/ocean-carbon-icon.png","alt":"Icon representing ocean carbon modeling","description":"In this project, led by Mohammad Amirian, we are exploring improving ML predictability of ocean carbon by adding new biogeochemical features and utilizing a hybrid local-global approach.","tags":["Ocean","Carbon","Machine Learning"],"featured":true,"url":"#ocean-carbon"},
  {"title":"Similarity Metrics for Climate Maps","image":"assets/projects/wavesim-icon.png","alt":"Icon representing WaveSim similarity metrics for climate maps","description":"In this project, led by Gabriele Accarino, we developed a new metric, WaveSim, that uses a wavelet decomposition framework to attribute differences between maps to physical scales, and can point to magnitude, displacement, and/or structural differences as the underlying cause of dissimilarity.","tags":["Climate","Metrics","Wavelets"],"featured":true,"url":"#climate-metrics"},
  {"title":"Wavelet Flow Matching for Multi-Scale Physics Emulation","image":"assets/projects/wavelet-flow-matching.png","alt":"Architecture diagram for Wavelet Flow Matching","description":"This project, led by Gabriele Accarino, develops a new latent representation for emulator systems that leverages the wavelet representation to separate physical scales.","tags":["Machine Learning","Emulation","Wavelets"],"featured":true,"url":"#wavelet-flow-matching"},
  {"title":"Statistical Representations of Ocean Carbon","image":"assets/projects/info-imb-carbon.png","alt":"Icon representing information imbalance for ocean carbon","description":"In this project, led by Viviana, we use the intrinsic dimension and the differentiable information imbalance to quantify the information content and representation quality of ocean carbon in global ocean biogeochemistry models and in SOCAT observations.","tags":["Ocean Carbon","Statistics","Representation Learning"],"featured":true,"url":"#statistical-representations-ocean-carbon"},
  {"title":"Symbolic Regression for Ocean Carbon","image":"assets/projects/symbolic-regression.png","alt":"Icon representing symbolic regression for ocean carbon","description":"In this project, led by Jina Yu and Mohammad Amirian, we use symbolic regression to look for a closed analytic form to express surface ocean carbon as a function of other environmental variables, looking at various spatio-temporal stratifications.","tags":["Ocean Carbon","Symbolic Regression","Machine Learning"],"featured":false,"url":"#symbolic-regression-ocean-carbon"},
  {"title":"AI Emulators through the WaveSim Lens","image":"assets/projects/ai-emulators.png","alt":"Icon representing AI weather and climate emulators through the WaveSim lens","description":"This project, led by Davide Donno and Gabriele Accarino, aims to examine the predictive properties of various AI-trained weather and climate emulators, including Davide's own Neptune, using the WaveSim metric to disentangle differences and attribute them to different scales and components.","tags":["AI Emulators","WaveSim","Climate"],"featured":false,"url":"#ai-emulators-wavesim-lens"},
  {"title":"Tree-based diffusion models for ocean carbon","image":"assets/projects/treeffuser-icon.png","alt":"Icon representing Treeffuser diffusion models for ocean carbon","description":"In this project, led by Gabriele Accarino and Mohammad Amirian, we look at using Treeffuser, a generative diffusion-based model that uses decision trees as the main learner, to provide uncertainty quantification and a samplable data distribution for ocean carbon.","tags":["Ocean Carbon","Diffusion Models","Uncertainty"],"featured":false,"url":"#tree-based-diffusion-ocean-carbon"},
  {"title":"GenAI tools for Science: Perspectives from early career researchers","image":"assets/projects/llms-science-icon.png","alt":"Icon representing generative AI tools for science","description":"In this project, led by five CUNY graduate students who took the graduate \"LLMs for Science\" class taught by Viviana in Spring 2026, we consider various challenges and opportunities provided by generative AI tools in the development and career progression of Physics researchers.","tags":["Generative AI","Science","Early Career Researchers"],"featured":false,"url":"#genai-tools-for-science"},
  {"title":"The role of ensembling in LLM efficacy","image":"assets/projects/sprout.png","alt":"Sprout icon representing ensembling strategies for large language models","description":"This project, led by CUNY Physics Ph. D. student Owen Root, examines the impact of different synthesization and aggregation strategies in the efficacy of large language models for different mathematical, knowledge-recall, and scientific benchmarks.","tags":["Large Language Models","Ensembling","Benchmarks"],"featured":false,"url":"#llm-ensembling-efficacy"},
  {"title":"Data Valuation for Ocean Carbon","image":"assets/projects/data-valuation-icon.png","alt":"Icon representing data valuation for ocean carbon observations","description":"In this project, led by Amanda Fay of the McKinley Ocean Carbon group, we look at how we can attribute value to existing observations of ocean carbon through a game theory (Shapley) approach and how this information can be leveraged to plan future observations.","tags":["Ocean Carbon","Data Valuation","Shapley Values"],"featured":false,"url":"#data-valuation-ocean-carbon"}
]
