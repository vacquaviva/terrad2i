[
  {"group":"pi","name":"Viviana Acquaviva","position":"Principal Investigator","affiliation":"CUNY City Tech and CUNY Graduate Center","photo":"assets/people/viviana-acquaviva.png","alt":"Portrait of Viviana Acquaviva","bio":"Viviana is a Professor of Physics at CUNY and the founder of TerraD2I. After many years of research in cosmology and galaxy evolution, she pivoted toward climate data science, where she develops statistical and machine learning tools to evaluate and improve climate models and to reconstruct environmental fields from sparse observations. She is also broadly interested in AI x Science and in how AI can enhance scientific workflow without compromising creativity and integrity.","links":[{"label":"GitHub","url":"https://github.com/vacquaviva","type":"github"},{"label":"Google Scholar","url":"https://scholar.google.com/citations?hl=en&user=9HxYZTUAAAAJ&view_op=list_works&sortby=pubdate","type":"scholar"}]},
  {"group":"member","name":"Gabriele Accarino","position":"Postdoctoral Researcher","affiliation":"Columbia University","photo":"assets/people/davide.jpg","alt":"Portrait of Gabriele Accarino","bio":"Gabriele works at the intersection of machine learning and Earth system science. His research focuses on multi-scale representations of geophysical processes, evaluation metrics for Earth system models, and generative modeling for physics emulation.\n\nHe holds a Ph.D. in Environmental Sciences, a M.Sc. in Computer Engineering, and a B.Sc. in Information Engineering from the University of Salento, Italy. Before joining Columbia, he was Junior Scientist and Head of the Machine Learning Research Unit at the Euro-Mediterranean Center on Climate Change (CMCC), where he led projects on climate AI, digital twins, and environmental forecasting.","links":[{"label":"GitHub","url":"https://github.com/gabrieleaccarino","type":"github"},{"label":"Google Scholar","url":"https://scholar.google.com/citations?hl=en&user=5MS80FIAAAAJ&view_op=list_works&sortby=pubdate","type":"scholar"}]},
  {"group":"member","name":"Mohammad Amirian","position":"Postdoctoral Researcher","affiliation":"CUNY City Tech","photo":"assets/people/mohammad.png","alt":"Portrait of Mohammad Amirian","bio":"Mohammad is an applied mathematician and statistician working at the intersection of oceanography, biology, and data science.\n\nHis work combines statistical modeling, machine learning, differential equations, and numerical simulation to study marine primary productivity, ocean carbon cycling, and phytoplankton physiology under changing environmental conditions. He is particularly interested in interpretable and physically grounded approaches to climate and ecological data science, including hierarchical modeling, uncertainty quantification, and meta-analytic methods.","links":[{"label":"GitHub","url":"https://github.com/Mohammad-Amirian","type":"github"},{"label":"Google Scholar","url":"https://scholar.google.com/citations?hl=en&user=XoNa1sIAAAAJ&view_op=list_works&sortby=pubdate","type":"scholar"}]},
  {"group":"member","name":"Dhruv Chakraborty","position":"Ph. D. Student","affiliation":"CUNY City Tech and GC","photo":"assets/people/dhruv.jpg","alt":"Portrait of Dhruv Chakraborty","bio":"Dhruv just started a Ph.D. in Earth and Environmental Science and is interested in applying machine learning to improve reconstructions of surface-ocean carbon from sparse and uneven observations. They received their BS in Computational Mathematics from UCLA in 2021 and previously worked as a data scientist on responsible AI at Indeed, where they built tools to evaluate and mitigate bias in AI systems used for high-stakes employment decisions.","links":[{"label":"LinkedIn","url":"https://www.linkedin.com/in/dhruv-chakraborty/","type":"linkedin"}]},
  {"group":"member","name":"Jina Yu","position":"Master’s Student","affiliation":"Columbia University","photo":"assets/people/jina.jpg","alt":"Portrait of Jina Yu","bio":"Jina’s thesis focused on physics-informed neural networks. She is broadly interested in scientific machine learning, dynamical systems, and climate modeling.","links":[]},
  {"group":"member","name":"Davide Donno","position":"Visiting Ph. D. Student","affiliation":"University of Salento and CMCC Foundation","photo":"assets/people/gabriele.jpg","alt":"Portrait of Davide Donno","bio":"Davide is a PhD student in Engineering of Complex Systems. He studies data-driven techniques for the coupling between Atmosphere and Ocean systems, with the goal of emulating the Earth System key variables at a Subseasonal-to-Seasonal scale.\n\nHe previously worked as Machine Learning engineer and is proficient in several cutting edge Machine Learning architectures including Transformers, Mamba, (Spherical) Fourier Neural Operators, and UNet, as well as in distributed environments.","links":[{"label":"Google Scholar","url":"https://scholar.google.com/citations?hl=en&user=3dcEtsYAAAAJ&view_op=list_works&sortby=pubdate","type":"scholar"}]}
]
